# =========================================================
# Cau hinh local thuc te cho PayOS tren may dev hien tai.
# File nay da duoc .gitignore bo qua de tranh commit secret/domain local.
# Sau nay khi deploy that, hay dua cac gia tri nay sang env hoac secret manager.
# =========================================================

# Bat PayOS cho local
app.payos.enabled=true

# Tam thoi giu theo gia tri local hien co cua du an de test nhanh.
# Khi chuyen sang moi truong that, nen dua sang env va bo khoi source.
app.payos.client-id=${PAYOS_CLIENT_ID:a703d984-ca43-4ae5-a473-c9c2fcdc13fa}
app.payos.api-key=${PAYOS_API_KEY:930b93d0-865d-407c-b732-951c920c13cb}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:a593dc88b912f7d89681061d22ca8b15c33e33d352f3057725911c27aafabd72}
app.payos.base-url=${PAYOS_BASE_URL:https://api-merchant.payos.vn}

# Local toi thieu:
# - Neu checkout mo tren cung may POS, localhost:5173 la du cho return/cancel.
# - Neu khach quet QR tren thiet bi khac, doi sang domain FE public hoac set VITE_PAYOS_RESULT_BASE_URL ben FE.
app.payos.return-url=${PAYOS_RETURN_URL:http://localhost:5173/payment-success}
app.payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:5173/payment-cancel}

# Webhook phai la URL public de PayOS goi vao backend local.
# Luu y: voi ngrok free, domain co the doi sau moi lan mo tunnel moi.
# Neu tunnel doi, hay cap nhat lai gia tri nay hoac truyen PAYOS_WEBHOOK_URL qua env.
app.payos.webhook-url=${PAYOS_WEBHOOK_URL:https://overload-stopper-substance.ngrok-free.dev/api/v1/payment-gateways/payos/webhook}

app.payos.partner-code=${PAYOS_PARTNER_CODE:}
app.payos.request-timeout=${PAYOS_REQUEST_TIMEOUT:10s}
app.payos.default-expire-minutes=${PAYOS_DEFAULT_EXPIRE_MINUTES:15}
